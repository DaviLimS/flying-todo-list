<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header"></header>
     <main class="main">
        <dialog id="task-modal">
            <form method="dialog" id="formCardCreator">
                <h2 class="modal-title">Nova Tarefa</h2>
                <input id="task-title" type="text" placeholder="Título">
                <textarea name="description" id="task-description" placeholder="Descrição"></textarea>
                <div class="checkboxChecker">
                    <input type="checkbox" id="thereCheckbox">
                    <p class="checkboxPlaceholder">o card vai ter checkbox</p>
                </div>
                <button class="save-task" value="default">Salvar</button>
                <button class="cancel-button" value="cancel">Cancelar</button>
            </form>
        </dialog>

        <dialog id="alert-modal">
            <h3 class="alert-title">Você tem certeza disso?</h3>
            <p class="alert-text">Essa ação deletará TODOS os seu todo's, de forma ccompletamente irreversível, dentre muitos outros adjetivos pra exprimir as graves consequências dessa ação</p>
            <button class="accept-alert" value="default">Continuar</button>
            <button class="recuse-alert" value="cancel">Recusar</button>
        </dialog>
     </main>
     <aside class="sidebar">
        <div class="sidebarButtons">
            <button class="open-modal btn">Nova Tarefa</button>
            <button class="delete-All btn">Deletar Todos</button>
        </div>
     </aside>
</body>
</html>
